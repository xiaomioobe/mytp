# ============================================================
# MyTP - Fabric MOD 构建配置（Minecraft 26.2）
# ============================================================
# 说明：本机 JDK 25 三个坑已在下面解决：
#  1) WEPollSelector 在 Windows 上初始化失败（Unix Domain Socket 管道连接被拒）
#     → 强制传统 WindowsSelectorProvider；
#  2) Java 25 默认模块集不含 jdk.zipfs，Loom 打开 minecraft jar 时报
#     Provider "jar" not found → 追加 --add-modules=jdk.zipfs；
#  3) 本机 IPv6 环回(::1) TCP 不通，Gradle 客户端连 daemon 时报
#     Unable to establish loopback connection → 强制 IPv4 栈。
org.gradle.jvmargs=-Djava.nio.channels.spi.SelectorProvider=sun.nio.ch.WindowsSelectorProvider -Djava.net.preferIPv4Stack=true -Xmx2G --add-modules=jdk.zipfs
org.gradle.parallel=true

# ============================================================
# 版本号（已按 Fabric 官方 26.2 的稳定构建号填好）
#   数据来源：https://meta.fabricmc.net/v2/versions/loader/26.2
#             https://maven.fabricmc.net/
#   26.2 已无 yarn 映射，映射统一走 Mojang 官方映射（见 build.gradle）
# ============================================================
minecraft_version=26.2
loader_version=0.19.5
fabric_version=0.159.0+26.2

# ============================================================
# MOD 信息
# ============================================================
mod_version=1.0.0
maven_group=com.mytp
archives_base_name=mytp
