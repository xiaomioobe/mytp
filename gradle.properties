# ============================================================
# MyTP - Fabric MOD 构建配置（Minecraft 26.3）
# ============================================================
# Java 25 默认模块集不含 jdk.zipfs，Loom 打开 minecraft jar 时会报
# Provider "jar" not found，因此追加 --add-modules=jdk.zipfs。
org.gradle.jvmargs=-Xmx3G --add-modules=jdk.zipfs
org.gradle.parallel=true

# ============================================================
# 版本号（已按 Fabric 官方 26.3 的稳定构建号填好）
#   数据来源：https://meta.fabricmc.net/v2/versions/loader/26.3
#             https://maven.fabricmc.net/
#   26.3 无 yarn 映射，游戏 jar 直接以官方命名发布（见 build.gradle）
# ============================================================
minecraft_version=26.3
loader_version=0.20.1
fabric_version=0.165.2+26.3

# ============================================================
# MOD 信息
# ============================================================
mod_version=1.3.0
maven_group=com.mytp
archives_base_name=mytp
